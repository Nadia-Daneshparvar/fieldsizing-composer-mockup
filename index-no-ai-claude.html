    return { headerRow, inputGrain, mapping: res.mapping, confidence };
  }

  // ---------------------------------------------------------------------------
  // applyMapping
  // ---------------------------------------------------------------------------
  // returns {n:number|null, pct:bool, bad:bool}
  function parseNumber(v, decimalComma) {
    if (v === null || v === undefined) return { n: null, pct: false, bad: false };
    if (typeof v === 'number') return isFinite(v) ? { n: v, pct: false, bad: false } : { n: null, pct: false, bad: true };
    if (typeof v === 'boolean') return { n: null, pct: false, bad: true };
    let s = String(v).replace(/[\s ]+/g, '');
    if (s === '') return { n: null, pct: false, bad: false };
    let neg = false, pct = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (/%$/.test(s)) { pct = true; s = s.slice(0, -1); }
    s = s.replace(/^[$€£]|[$€£]$/g, '');
    const hasDot = s.indexOf('.') >= 0, hasComma = s.indexOf(',') >= 0;
    if (hasDot && hasComma) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (hasComma) {
      if (!decimalComma && /^-?\d{1,3}(,\d{3})+$/.test(s)) s = s.replace(/,/g, '');
      else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
      else if (/^-?\d{1,3}(,\d{3})+$/.test(s)) s = s.replace(/,/g, '');
    }
    if (!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(s)) return { n: null, pct, bad: true };
    let n = Number(s);
    if (neg) n = -n;
    return isFinite(n) ? { n, pct, bad: false } : { n: null, pct, bad: true };
  }
  function idStr(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(v);
    return String(v).trim();
  }
  const TOTAL_RE = /^(grand\s+)?(total|totals|sum|all)$/i;

  function applyMapping(sheet, opts, method) {
    const F = fields();
    const rows = (sheet && sheet.rows) || [];
    const o = opts || {};
    const headerRow = isNum(o.headerRow) ? o.headerRow : 0;
    const inputGrain = o.inputGrain === 'entity' ? 'entity' : 'summary';
    const mapping = o.mapping || {};
    const decimalComma = sheet && sheet.delimiter === ';';
    const errors = [], warnings = [];
    const err = (code, path, message) => errors.push({ code, path, message });
    const warn = (code, path, message) => warnings.push({ code, path, message });
    const headers = (rows[headerRow] || []).map(cellStr);
    const label = id => { const f = F.MAPPING_FIELDS.find(x => x.id === id); return f ? f.label : id; };
    const colLabel = id => { const ci = mapping[id]; return headers[ci] ? `"${headers[ci]}"` : `column ${colName(ci)}`; };

    const required = F.requiredMapping(method, inputGrain);
    required.forEach(id => {
      if (!isNum(mapping[id])) err('mapping-required', `mapping.${id}`, `Map a column to "${label(id)}"; it is required for this method and input level.`);
    });
    Object.keys(mapping).forEach(id => {
      if (isNum(mapping[id]) && (mapping[id] < 0 || mapping[id] >= Math.max(headers.length, 1) + 200)) err('mapping-invalid', `mapping.${id}`, `Mapped column for "${label(id)}" is out of range.`);
    });
    if (errors.length) return finishIssues({ segments: [], entities: null, errors, warnings, rowCount: 0, preview: [] }, F, method);

    const dataRows = [];
    let blankInside = 0;
    for (let r = headerRow + 1; r < rows.length; r++) {
      if (isBlankRow(rows[r])) { blankInside++; continue; }
      dataRows.push({ r, row: rows[r] });
    }
    // trailing blanks do not count as "inside"
    if (dataRows.length) { let t = 0; for (let r = rows.length - 1; r > dataRows[dataRows.length - 1].r; r--) t++; blankInside -= t; }
    if (blankInside > 0) warn('blank-rows-skipped', 'rows', `${blankInside} blank row(s) between data rows were skipped.`);
    const get = (row, id) => (isNum(mapping[id]) ? row[mapping[id]] : undefined);
    const has = id => isNum(mapping[id]);
    const sheetRow = r => r + 1;

    // Reach: column-level unit decision (all numeric values <= 1 and none written with % => fractions)
    let reachFraction = false, reachMixed = false;
    if (has('reachPct')) {
      const vals = dataRows.map(d => get(d.row, 'reachPct')).filter(v => v !== null && v !== undefined && v !== '');
      const parsed = vals.map(v => parseNumber(v, decimalComma)).filter(p => !p.bad && p.n !== null);
      const plain = dataRows.map(d => ({ r: sheetRow(d.r), p: parseNumber(get(d.row, 'reachPct'), decimalComma) }))
        .filter(x => !x.p.bad && x.p.n !== null && !x.p.pct);
      const small = plain.filter(x => x.p.n > 0 && x.p.n <= 1), big = plain.filter(x => x.p.n > 1);
      if (small.length && big.length) {
        const list = a => a.slice(0, 15).map(x => x.r).join(', ') + (a.length > 15 ? ` and ${a.length - 15} more` : '');
        err('reach-mixed-scale', 'reachPct', `Reach values in ${colLabel('reachPct')} mix fractions and percents: rows ${list(small)} are 1 or less (fraction scale), rows ${list(big)} are above 1 (percent scale). Use one percent scale for the whole column (for example 85 or 85%).`);
        reachMixed = true;
      }
      reachFraction = !reachMixed && plain.length > 0 && parsed.every(p => !p.pct) && small.length > 0 && !big.length;
      if (reachFraction) warn('reach-fraction-converted', 'reachPct', `Reach values in ${colLabel('reachPct')} were on a 0 to 1 scale; they were multiplied by 100 and stored as percent (for example 85%).`);
    }
    function readReach(d) {
      const v = get(d.row, 'reachPct');
      const p = parseNumber(v, decimalComma);
      if (p.n === null && !p.bad) return null;
      if (p.bad) { err('non-numeric', `row ${sheetRow(d.r)}.reachPct`, `Row ${sheetRow(d.r)}: Reach % "${v}" is not a number.`); return undefined; }
      if (reachMixed) return undefined;
      let n = p.pct ? p.n : (reachFraction ? p.n * 100 : p.n);
      if (reachFraction) n = Math.round(n * 1e9) / 1e9;
      if (n < 0 || n > 100) { err('reach-out-of-range', `row ${sheetRow(d.r)}.reachPct`, `Row ${sheetRow(d.r)}: Reach % ${cellStr(v)} must be between 0% and 100%.`); return undefined; }
      return n;
    }
    function readNum(d, id, opt) {
      const v = get(d.row, id);
      const p = parseNumber(v, decimalComma);
      const nm = opt.name || label(id);
      if (p.bad || (p.pct && !opt.allowPct)) { err('non-numeric', `row ${sheetRow(d.r)}.${id}`, `Row ${sheetRow(d.r)}: ${nm} "${cellStr(v)}" is not a number.`); return undefined; }
      if (p.n === null) { if (opt.required) err('value-missing', `row ${sheetRow(d.r)}.${id}`, `Row ${sheetRow(d.r)}: ${nm} is empty.`); return opt.required ? undefined : null; }
      if (p.n < 0) { err('negative-value', `row ${sheetRow(d.r)}.${id}`, `Row ${sheetRow(d.r)}: ${nm} cannot be negative (${cellStr(v)}).`); return undefined; }
      return p.n;
    }
    function isTotalRow(d) { const s = idStr(get(d.row, 'segment')); return TOTAL_RE.test(s); }

    const blankSeg = () => ({ segment: '', entities: 0, compositeValue: null, reachPct: null, maxCalls: null, minCalls: null,
      plannedCalls: null, customSharePct: null, archetypeMix: null });
    const needValue = method !== 'workload';
    let segments = [], entities = null, rowCount = 0;

    if (inputGrain === 'entity') {
      entities = [];
      const bySeg = new Map();
      const idSeen = new Map();       // id -> [{segment,row}]
      const attrCols = headers.map((h, ci) => ci).filter(ci => !Object.keys(mapping).some(k => mapping[k] === ci) && headers[ci]);
      dataRows.forEach(d => {
        if (isTotalRow(d)) { warn('total-row-excluded', `row ${sheetRow(d.r)}`, `Row ${sheetRow(d.r)} looks like a total row ("${idStr(get(d.row, 'segment'))}") and was not imported.`); return; }
        rowCount++;
        const id = idStr(get(d.row, 'entityId'));
        const seg = idStr(get(d.row, 'segment'));
        let ok = true;
        if (!id) { err('value-missing', `row ${sheetRow(d.r)}.entityId`, `Row ${sheetRow(d.r)}: Entity ID is empty.`); ok = false; }
        if (!seg) { err('value-missing', `row ${sheetRow(d.r)}.segment`, `Row ${sheetRow(d.r)}: Decile / segment is empty.`); ok = false; }
        let value = null;
        if (has('value')) { value = readNum(d, 'value', { required: needValue && required.includes('value') }); if (value === undefined) { ok = false; value = null; } }
        let archetype = null;
        if (has('archetype')) {
          const raw = get(d.row, 'archetype');
          archetype = archetypeName(raw);
          if (!archetype && method === 'response') { err('unknown-archetype', `row ${sheetRow(d.r)}.archetype`, `Row ${sheetRow(d.r)}: Curve archetype "${cellStr(raw)}" is not one of ${ARCH.join(', ')}.`); ok = false; }
          if (!archetype && raw !== null && raw !== undefined && method !== 'response') archetype = cellStr(raw);
        }
        const reach = has('reachPct') ? readReach(d) : null;
        const planned = has('plannedCalls') ? readNum(d, 'plannedCalls', { required: false }) : null;
        const maxc = has('maxCalls') ? readNum(d, 'maxCalls', { required: false }) : null;
        if (isNum(maxc) && !Number.isInteger(maxc)) { err('not-whole', `row ${sheetRow(d.r)}.maxCalls`, `Row ${sheetRow(d.r)}: ${label('maxCalls')} must be a whole number (${maxc}).`); ok = false; }
        if (reach === undefined || planned === undefined || maxc === undefined) ok = false;
        if (id) { if (!idSeen.has(id)) idSeen.set(id, []); idSeen.get(id).push({ segment: seg, row: sheetRow(d.r) }); }
        const attrs = {};
        attrCols.forEach(ci => { if (d.row[ci] !== null && d.row[ci] !== undefined) attrs[headers[ci]] = d.row[ci]; });
        if (isNum(maxc)) attrs.maxCalls = maxc;
        if (!ok) return;
        entities.push({ id, segment: seg, value, archetype, attrs });
        if (!bySeg.has(seg)) bySeg.set(seg, { n: 0, value: 0, hasValue: false, reach: [], planned: [], arch: {} });
        const a = bySeg.get(seg);
        a.n++; if (isNum(value)) { a.value += value; a.hasValue = true; }
        if (isNum(reach)) a.reach.push(reach);
        if (isNum(planned)) a.planned.push(planned);
        if (archetype) a.arch[archetype] = (a.arch[archetype] || 0) + 1;
      });
      // duplicate IDs
      const cross = [], same = [];
      idSeen.forEach((list, id) => {
        if (list.length < 2) return;
        const segs = Array.from(new Set(list.map(x => x.segment)));
        const where = list.map(x => `row ${x.row} (segment ${x.segment})`).join(', ');
        if (segs.length > 1) cross.push(`${id}: ${where}`); else same.push(`${id}: ${where}`);
      });
      if (cross.length) err('duplicate-entity-id', 'entityId', `Entity IDs appear in more than one segment: ${cross.slice(0, 20).join('; ')}${cross.length > 20 ? `; and ${cross.length - 20} more` : ''}.`);
      if (same.length) err('duplicate-entity-id-same-segment', 'entityId', `Entity IDs appear more than once: ${same.slice(0, 20).join('; ')}${same.length > 20 ? `; and ${same.length - 20} more` : ''}.`);
      // segments ordered: numeric labels descending (decile 10 first), else first appearance
      let keys = Array.from(bySeg.keys());
      if (keys.length && keys.every(k => /^-?\d+(\.\d+)?$/.test(k))) keys.sort((x, y) => Number(y) - Number(x));
      segments = keys.map(k => {
        const a = bySeg.get(k), s = blankSeg();
        s.segment = k; s.entities = a.n; s.compositeValue = a.hasValue ? a.value : null;
        if (a.reach.length) {
          const same = a.reach.every(x => x === a.reach[0]);
          s.reachPct = same ? a.reach[0] : sum(a.reach) / a.reach.length;
          if (!same) warn('reach-varies-in-segment', `segments.${k}.reachPct`, `Segment ${k}: reach differs between entities; the average (${Math.round(s.reachPct * 10) / 10}%) is used for the segment.`);
          if (a.reach.length < a.n) warn('reach-partly-missing', `segments.${k}.reachPct`, `Segment ${k}: ${a.n - a.reach.length} entities have no reach value; the segment reach uses the entities that do.`);
        }
        if (a.planned.length) {
          const same = a.planned.every(x => x === a.planned[0]);
          s.plannedCalls = same ? a.planned[0] : sum(a.planned) / a.planned.length;
          if (!same) warn('planned-calls-vary-in-segment', `segments.${k}.plannedCalls`, `Segment ${k}: planned calls differ between entities; the average (${Math.round(s.plannedCalls * 100) / 100}) is used and must be a whole number before calculating.`);
        }
        const archTotal = Object.keys(a.arch).reduce((t, x) => t + a.arch[x], 0);
        if (archTotal > 0) { s.archetypeMix = {}; ARCH.forEach(x => { s.archetypeMix[x] = 100 * (a.arch[x] || 0) / archTotal; }); }
        return s;
      });
      if (!has('reachPct')) warn('reach-not-supplied', 'reachPct', 'No reach column was mapped; enter Reach % for each segment before calculating.');
    } else {
      const seen = new Map();
      const mixCols = ARCH.filter(a => isNum(mapping['archetypeMix.' + a]));
      dataRows.forEach(d => {
        if (isTotalRow(d)) { warn('total-row-excluded', `row ${sheetRow(d.r)}`, `Row ${sheetRow(d.r)} looks like a total row ("${idStr(get(d.row, 'segment'))}") and was not imported.`); return; }
        rowCount++;
        const seg = idStr(get(d.row, 'segment'));
        let ok = true;
        if (!seg) { err('value-missing', `row ${sheetRow(d.r)}.segment`, `Row ${sheetRow(d.r)}: Decile / segment is empty.`); ok = false; }
        else if (seen.has(seg)) { err('duplicate-segment', `row ${sheetRow(d.r)}.segment`, `Row ${sheetRow(d.r)}: segment "${seg}" already appears on row ${seen.get(seg)}.`); ok = false; }
        else seen.set(seg, sheetRow(d.r));
        const n = readNum(d, 'entities', { required: true });
        const cv = has('compositeValue') ? readNum(d, 'compositeValue', { required: required.includes('compositeValue') }) : null;
        const reach = has('reachPct') ? readReach(d) : null;
        const planned = has('plannedCalls') ? readNum(d, 'plannedCalls', { required: false }) : null;
        if (n === undefined || cv === undefined || reach === undefined || planned === undefined) ok = false;
        let mix = null;
        if (mixCols.length) {
          mix = {};
          mixCols.forEach(a => {
            const p = parseNumber(d.row[mapping['archetypeMix.' + a]], decimalComma);
            if (p.bad) { err('non-numeric', `row ${sheetRow(d.r)}.archetypeMix.${a}`, `Row ${sheetRow(d.r)}: ${a} mix "${cellStr(d.row[mapping['archetypeMix.' + a]])}" is not a number.`); ok = false; return; }
            mix[a] = p.n === null ? 0 : p.n;
          });
          if (ok) {
            const tot = ARCH.reduce((t, a) => t + (mix[a] || 0), 0);
            if (tot > 0 && tot <= 1.0000001 && !mixCols.some(a => /%/.test(String(d.row[mapping['archetypeMix.' + a]])))) {
              ARCH.forEach(a => { if (a in mix) mix[a] = Math.round(mix[a] * 100 * 1e9) / 1e9; });
              warn('mix-fraction-converted', `row ${sheetRow(d.r)}.archetypeMix`, `Row ${sheetRow(d.r)}: archetype mix looked like fractions and was converted to percent.`);
            }
            ARCH.forEach(a => { if (!(a in mix)) mix[a] = 0; });
          }
        }
        if (!ok) return;
        const s = blankSeg();
        s.segment = seg; s.entities = n; s.compositeValue = cv; s.reachPct = reach; s.plannedCalls = planned; s.archetypeMix = mix;
        segments.push(s);
      });
      segments.forEach(s => { if (isNum(s.entities) && !Number.isInteger(s.entities)) warn('entities-not-whole', `segments.${s.segment}.entities`, `Segment ${s.segment}: entity count ${s.entities} is not a whole number.`); });
      if (!has('reachPct')) warn('reach-not-supplied', 'reachPct', 'No reach column was mapped; enter Reach % for each segment before calculating.');
    }
    if (!rowCount) err('no-data-rows', 'rows', 'No data rows were found below the header row.');
    // Preview: the first rows as they will be read (normalised: reach 85 not 0.85, canonical archetypes, trimmed ids).
    const PREVIEW_MAX = isNum(o.previewRows) ? o.previewRows : 50;
    const preview = [];
    for (const d of dataRows) {
      if (preview.length >= PREVIEW_MAX) break;
      const values = {}, problems = [];
      Object.keys(mapping).forEach(id => {
        if (!isNum(mapping[id])) return;
        const raw = d.row[mapping[id]];
        let v;
        if (id === 'entityId' || id === 'segment') v = idStr(raw) || null;
        else if (id === 'archetype') v = archetypeName(raw) || (raw === null || raw === undefined ? null : cellStr(raw));
        else {
          const p = parseNumber(raw, decimalComma);
          if (p.bad) { v = null; problems.push(id); }
          else if (id === 'reachPct') v = p.n === null ? null : (p.pct ? p.n : (reachFraction ? Math.round(p.n * 100 * 1e9) / 1e9 : p.n));
          else v = p.n;
        }
        values[id] = v;
      });
      preview.push({ row: sheetRow(d.r), values, labels: Object.keys(values).reduce((m, id) => { m[id] = label(id); return m; }, {}), problems,
        excluded: isTotalRow(d) ? 'Total row, not imported' : null });
    }
    return finishIssues({ segments, entities, errors, warnings, rowCount, preview }, F, method);
  }

  // Every Issue carries a human message plus the field label it concerns (contract v1.7); codes and paths stay for the detail toggle.
  function issueLabel(F, path) {
    const p = String(path || '');
    const ids = F.MAPPING_FIELDS.map(f => f.id).sort((a, b) => b.length - a.length);
    for (const id of ids) if (new RegExp('(^|[.\\s])' + id.replace('.', '\\.') + '($|[.\\s])').test(p)) return F.MAPPING_FIELDS.find(f => f.id === id).label;
    const seg = F.SEGMENT_FIELDS.find(f => new RegExp('(^|[.])' + f.id + '($|[.])').test(p));
    if (seg) return seg.label('hcp');
    if (/^mapping/.test(p)) return 'Column mapping';
    if (/^row \d+/.test(p)) return 'Row';
    return 'Rows';
  }
  function finishIssues(res, F, method) {
    const add = x => { if (!x.label) x.label = issueLabel(F, x.path); return x; };
    res.errors.forEach(add); res.warnings.forEach(add);
    return res;
  }

  function previewRows(sheet, opts, method, limit) {
    const o = Object.assign({}, opts || {}, { previewRows: isNum(limit) ? limit : 20 });
    return applyMapping(sheet, o, method).preview;
  }

  function rankSheets(workbook, method) {
    const F = fields();
    const sheets = (workbook && workbook.sheets) || [];
    const out = sheets.map((sh, idx) => {
      const rows = sh.rows || [];
      if (!rows.some(r => !isBlankRow(r))) return { name: sh.name, score: 0, idx };
      const d = detect(sh, method);
      const req = F.requiredMapping(method, d.inputGrain);
      const mapped = req.filter(id => isNum(d.mapping[id]));
      const dataRows = rows.slice(d.headerRow + 1).filter(r => !isBlankRow(r)).length;
      const conf = mapped.length ? mapped.reduce((t, id) => t + (d.confidence[id] || 0), 0) / mapped.length : 0;
      let score = dataRows === 0 ? 0 : 0.6 * (mapped.length / req.length) + 0.2 * Math.min(1, dataRows / 5) + 0.2 * conf;
      if (sh.hidden) score *= 0.5;
      return { name: sh.name, score: Math.round(score * 1000) / 1000, idx, headerRow: d.headerRow, inputGrain: d.inputGrain, dataRows };
    });
    return out.sort((a, b) => b.score - a.score || a.idx - b.idx).map(x => { const y = Object.assign({}, x); delete y.idx; return y; });
  }

  // ---------------------------------------------------------------------------
  // XLSX writer
  // ---------------------------------------------------------------------------
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const NSR = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  function clean(s) {

      .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(^|[^\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '$1');

    return s;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  // style ids (cellXfs order)
  const ST = { DEF: 0, HDR: 1, TITLE: 2, NOTE: 3, LABEL: 4, INT: 5, NUM: 6, FTE: 7, PCT: 8, PCT1: 9, CURVE: 10, WRAP: 11,
    B_INT: 12, B_NUM: 13, B_FTE: 14, SECTION: 15, DEC: 16, B_DEC: 17, ENG_NUM: 18, ENG_INT: 19, ENG_CURVE: 20, ENG_TXT: 21 };
  function stylesXml() {
    const xfs = [
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>',
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>',
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>',
      '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>',
      '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>',
      '<xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>',
      '<xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>',
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>',
      '<xf numFmtId="9" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>',
      '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>',
      '<xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>',
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>',

      f: `IF(${L(r, 'calls')}=0,IF(${L(r, 'reached')}=0,${q(exclusionLabel(F, 'no-reach', method))},${q(exclusionLabel(F, 'no-planned-calls', method))}),"")` }));
    else add('excl', `Exclusion reason: ${ENGINE_NOTE}`, ST.ENG_TXT, i => ({ v: exclV(i) }));
    S.line(cols.map(x => x.h), ST.HDR);
    S.freeze = hdrRow + 1;
    const first = S.r;
    segs.forEach((seg, i) => {
      const r = S.r++;
      cols.forEach((col, ci) => {
        const cell = col.fn(i, r);
        if (cell.f) S.set(r, ci, cell.v, col.s, cell.f);
        else S.set(r, ci, cell.v, col.s);
      });
    });
    const last = S.r - 1;
    const tr = S.r++;
    const R = {};
    const sumCol = (key, cached, style) => {
      if (C[key] === undefined) return;
      const L0 = colName(C[key]);
      const f = segs.length ? `SUM(${L0}${first + 1}:${L0}${last + 1})` : null;
      S.set(tr, C[key], cached, style, f);
      R[key] = `${L0}${tr + 1}`;
    };
    S.set(tr, 0, 'Total', ST.LABEL);
    sumCol('entities', num(T.entities), ST.B_INT);
    sumCol('accessible', num(T.accessible), ST.B_NUM);
    sumCol('alloc', sum(segs.map(s => s.allocatedValue)), ST.B_INT);
    sumCol('affCalls', sum(segs.map(s => s.affordableCalls)), ST.B_NUM);
    sumCol('reached', num(T.reached), ST.B_NUM);
    sumCol('calls', num(T.totalCalls), ST.B_NUM);
    sumCol('fte', num(T.rawFte), ST.B_FTE);
    sumCol('plan', sum(res.planningAllocation || []), ST.B_INT);
    sumCol('contrib', method === 'workload' ? null : sum(segs.map(s => s.contribution)), ST.B_INT);
    S.skip();
    S.line(['Totals and KPIs'], ST.SECTION);
    S.line(['Measure', 'Value', 'Formula'], ST.HDR);
    const kpi = (label, v, f, s) => { const r = S.r++; S.set(r, 0, label, ST.LABEL); S.set(r, 1, v, s, f); S.set(r, 2, f ? 'Formula: ' + f : (v === 'N/A' ? 'Not applicable' : 'Calculated by the sizing engine'), ST.NOTE); return S.addr(r, 1); };
    const K = {};
    const cRaw = kpi(F.RESULT_LABELS.rawFte(g), num(T.rawFte), R.fte, ST.FTE);
    const rounding = c.sh.fteRounding || 'nearest';
    const recF = rounding === 'up' ? `MAX(0,ROUNDUP(${R.fte}-1E-9,0))` : rounding === 'none' ? `${R.fte}` : `ROUND(${R.fte},0)`;
    const cRec = kpi(F.RESULT_LABELS.recommendedFte(g), num(T.recommendedFte), recF, rounding === 'none' ? ST.B_FTE : ST.B_INT);
    kpi('Rounding delta (recommended − raw)', num(T.roundingDelta), `${cRec}-${cRaw}`, ST.FTE);
    K.avg = kpi(F.RESULT_LABELS.avgCallsPerReached(g), isNum(T.avgCallsPerReached) ? T.avgCallsPerReached : '', `IF(${R.reached}>0,${R.calls}/${R.reached},"")`, ST.NUM);
    K.perRep = kpi(F.RESULT_LABELS.entitiesPerRep(g), isNum(T.entitiesPerRep) ? T.entitiesPerRep : '', `IF(${cRec}>0,${R.reached}/${cRec},"")`, ST.NUM);
    let cCost = null;
    if (cpc) cCost = K.cost = kpi(F.RESULT_LABELS.fieldCost(g), num(T.fieldCost), `${R.calls}*${cpc}`, ST.INT);
    if (method === 'workload') kpi(F.RESULT_LABELS.roi(g), 'N/A', null, ST.DEF);
    else if (cCost) {
      const net = method === 'response' && c.opts.roiBasis === 'net';
      K.roi = kpi(method === 'response' ? `ROI (${net ? 'net' : 'gross'})` : F.RESULT_LABELS.roi(g), isNum(T.roi) ? T.roi : 'N/A',
        `IF(${cCost}>0,${R.contrib}/${cCost}${net ? '-1' : ''},"N/A")`, ST.NUM);
      if (net) K.roiGross = kpi('ROI (gross ratio)', isNum(T.roiGross) ? T.roiGross : 'N/A', `IF(${cCost}>0,${R.contrib}/${cCost},"N/A")`, ST.NUM);
    } else kpi(F.RESULT_LABELS.roi(g), isNum(T.roi) ? T.roi : 'N/A', null, ST.NUM);
    if (method === 'affordable' && isNum(T.forfeitedValue)) K.forfeited = kpi('Value forfeited below minimum', T.forfeitedValue, `${R.alloc}-${R.contrib}`, ST.INT);
    if (T.layers && A.flmSpan) {
      K.flm = kpi('First-line managers (from span)', num(T.layers.firstLineManagers), `${cRaw}/${A.flmSpan}`, ST.NUM);
      K.slm = kpi('Second-line managers (from span)', num(T.layers.secondLineManagers), `${K.flm}/${A.slmSpan}`, ST.NUM);
    }
    S.maxW[0] = 28;
    const abs = a => (a ? `${sheetRef(S.name)}!$${a.replace(/\d+$/, '')}$${a.replace(/^[A-Z]+/, '')}` : null);
    const refs = { raw: abs(cRaw), rec: abs(cRec) };
    ['entities', 'accessible', 'reached', 'calls'].forEach(k => { refs[k] = abs(R[k]); });
    Object.keys(K).forEach(k => { refs[k] = abs(K[k]); });
    return { sheet: S, rawRef: refs.raw, recRef: refs.rec, refs };
  }

  function buildCurves(c, A) {
    const { F, inp } = c;
    const S = new SheetB(SHEETS.curves);
    const EN = G('FSEngine');
    const arch = EN && EN.ARCHETYPES;
    S.line(['Response Curves'], ST.TITLE);
    S.line(['Response(x) = (δ·x)^γ ÷ (x^γ + ρ); normalized response = Response(x) ÷ Response(X), where X is the normalization point.'], ST.NOTE);
    S.skip();
    if (!arch) { S.line(['Archetype parameters were not available to the exporter (sizing engine not loaded).']); return S; }
    const X = c.opts.scenarioMaxCalls;
    S.line(['Archetype parameters'], ST.SECTION);
    S.line(['Curve archetype', 'δ (delta)', 'γ (gamma)', 'ρ (rho)', 'Response at X'], ST.HDR);
    const P = {};
    ARCH.forEach(a => {
      const p = arch[a]; if (!p) return;
      const r = S.r;
      const xr = A.xnorm || String(X);
      S.line([a, { v: p.delta, s: ST.NUM }, { v: p.gamma, s: ST.NUM }, { v: p.rho, s: ST.NUM },
        { v: responseCurve(p, X), s: ST.CURVE, f: `(B${r + 1}*${xr})^C${r + 1}/(${xr}^C${r + 1}+D${r + 1})` }]);
      P[a] = { r, p };
    });
    S.skip();
    const maxSeg = Math.max(0, ...(inp.segments || []).map(s => (isNum(s.maxCalls) ? s.maxCalls : 0)));
    const top = Math.min(200, Math.max(X, maxSeg));
    S.line([`Normalized response by call count (0 to ${top})`], ST.SECTION);
    const names = ARCH.filter(a => P[a]);
    const hr = S.line(['Calls'].concat(names), ST.HDR);
    S.freeze = 0;
    for (let x = 0; x <= top; x++) {
      const r = S.r;
      const row = [{ v: x, s: ST.INT }];
      names.forEach(a => {
        const q = P[a].r + 1, p = P[a].p;
        row.push({ v: x === 0 ? 0 : responseCurve(p, x) / responseCurve(p, X), s: ST.CURVE,
          f: `IF($A${r + 1}=0,0,(($B$${q}*$A${r + 1})^$C$${q}/($A${r + 1}^$C$${q}+$D$${q}))/$E$${q})` });
      });
      S.line(row);
    }
    void hr;
    const mixOf = s => s.archetypeMix || (s.archetype ? { [s.archetype]: 100 } : null);
    const mixSegs = (inp.segments || []).filter(s => mixOf(s));
    if (mixSegs.length) {
      S.skip();
      S.line([inp.inputGrain === 'entity' ? 'Archetype mix by segment (from entity rows, for information)' : 'Archetype mix by segment (summary input)'], ST.SECTION);
      S.line([segLabel(F, 'segment', c.g)].concat(ARCH.map(a => `${a} %`)), ST.HDR);
      mixSegs.forEach(s => { const m = mixOf(s); S.line([txt(s.segment)].concat(ARCH.map(a => ({ v: isNum(m[a]) ? m[a] / 100 : 0, s: ST.PCT })))); });
    }
    S.minW[0] = 16;
    return S;
  }

  function buildComparison(scenarios, project, focusId) {
    const F = fields();
    const S = new SheetB(SHEETS.compare);
    S.line(['Scenario Comparison'], ST.TITLE);
    S.line(['All scenarios in the project. "Recommended" is set by the analyst, never automatically.'], ST.NOTE);
    S.skip();
    const ctxs = scenarios.map(s => ctxFor(s, project));
    const methods = new Set(ctxs.map(x => x.method));
    const anyVal = methods.has('affordable') || methods.has('response');
    const anyResp = methods.has('response');
    const g = ctxs[0] ? ctxs[0].g : 'hcp';
    const cols = [
      ['Scenario', x => txt(x.s.name)], ['Version', x => txt(x.s.version)], ['Status', x => STATUS[x.s.status] || txt(x.s.status)],
      ['Recommended', x => (x.s.recommended ? 'Yes' : 'No')], ['Focus scenario', x => (x.s.id === focusId ? 'Yes' : '')],
      ['Method', x => methodLabel(F, x.method)]
    ];
    if (anyVal) {
      cols.push(['Value allocation', x => (x.method === 'workload' ? '' : F.OPTION_LABELS.allocation[x.opts.allocation] || x.opts.allocation)]);
      cols.push(['ROI cutoff', x => (x.method === 'workload' ? '' : { v: x.opts.cutoff, s: ST.NUM })]);
    }
    if (anyResp) {
      cols.push(['ROI basis', x => (x.method === 'response' ? F.OPTION_LABELS.roiBasis[x.opts.roiBasis] : '')]);
      cols.push(['Stopping rule', x => (x.method === 'response' ? F.OPTION_LABELS.stoppingRule[x.opts.stoppingRule] : '')]);
      cols.push(['Normalization point (calls)', x => (x.method === 'response' ? { v: x.opts.scenarioMaxCalls, s: ST.INT } : '')]);
    }
    if (anyVal) cols.push(['Calibration factor', x => (x.method === 'workload' ? '' : { v: x.opts.calibrationFactor, s: ST.DEC })]);
    cols.push(['Capacity (calls per rep)', x => ({ v: capacityOf(x.sh), s: ST.INT })]);
    const optKeys = [];
    ctxs.forEach(x => methodologyOptions(x).forEach(o => { if (!optKeys.some(k => k.key === o.key) && !['roiBasis', 'stoppingRule', 'calibrationFactor'].includes(o.key)) optKeys.push({ key: o.key, label: o.label }); }));
    optKeys.forEach(k => cols.push([k.label, x => { const o = methodologyOptions(x).find(y => y.key === k.key); return o ? o.text + (o.changed ? ' (changed)' : '') : ''; }]));
    if (anyVal) cols.push(['Sizing start year', x => (x.method !== 'workload' && x.ma.value && Array.isArray(x.ma.value.years) && x.ma.value.years.length ? (isNum(x.ma.value.sizingStartYear) ? x.ma.value.sizingStartYear : 'Not entered') : (x.method === 'workload' ? '' : 'Annual value entered'))]);
    cols.push([F.RESULT_LABELS.rawFte(g), x => ({ v: num(x.totals.rawFte), s: ST.FTE })]);
    cols.push([F.RESULT_LABELS.recommendedFte(g), x => ({ v: num(x.totals.recommendedFte), s: ST.B_INT })]);
    cols.push([F.RESULT_LABELS.reached(g), x => ({ v: num(x.totals.reached), s: ST.NUM })]);
    cols.push([F.RESULT_LABELS.totalCalls(g), x => ({ v: num(x.totals.totalCalls), s: ST.NUM })]);
    cols.push([F.RESULT_LABELS.avgCallsPerReached(g), x => ({ v: num(x.totals.avgCallsPerReached), s: ST.NUM })]);
    cols.push([F.RESULT_LABELS.fieldCost(g), x => (isNum(x.totals.fieldCost) ? { v: x.totals.fieldCost, s: ST.INT } : 'N/A')]);
    if (anyVal) cols.push(['Value pool', x => (x.method !== 'workload' && isNum(x.totals.valuePool) ? { v: x.totals.valuePool, s: ST.INT } : 'N/A')]);
    cols.push([F.RESULT_LABELS.roi(g), x => (x.method !== 'workload' && isNum(x.totals.roi) ? { v: x.totals.roi, s: ST.NUM } : 'N/A')]);
    if (anyResp) cols.push(['ROI (gross ratio)', x => (x.method === 'response' && isNum(x.totals.roiGross) ? { v: x.totals.roiGross, s: ST.NUM } : (x.method === 'affordable' && isNum(x.totals.roi) ? { v: x.totals.roi, s: ST.NUM } : 'N/A'))]);
    S.line(cols.map(k => k[0]), ST.HDR);
    S.freeze = S.r;
    ctxs.forEach((x, i) => { x.s = scenarios[i]; S.line(cols.map(k => k[1](x))); });
    return S;
  }

  // Engine trace text uses option keys in a few places; show option labels instead (no raw keys in the export).
  function traceText(c, t) {
    const F = c.F;
    let f = txt(t.formula);
    const OL = F.OPTION_LABELS || {};
    for (const grp of Object.keys(OL)) if (OL[grp][f]) return OL[grp][f];                       // whole text is a key
    f = f.replace(/^(equal|proportional|custom):/, (m, k) => `${OL.allocation[k]}:`)
      .replace(/^(gross|net):/, (m, k) => `${OL.roiBasis[k]}:`);
    if (t.step === 'Response options') {
      const ma = c.ma, D = F.OPTION_DEFAULTS || {};
      const o = k => optLabel(F, k, ma[k] || D[k]);
      f = `${o('minimumBoundary')}; ${o('cutoffTie')}; ${o('reachAppliesTo')}`;
    }
    return f;
  }

  function buildFormulas(c) {
    const { F, method, g, res, opts } = c;
    const S = new SheetB(SHEETS.formulas);

  /* ---------- import wizard ---------- */
  function mappingFieldsFor(m, grain) {
    const req = F.requiredMapping(m, grain);

    const base = F.MAPPING_FIELDS.filter(f => {
      if (req.includes(f.id)) return true;
      if (f.grain && f.grain !== grain) return false;
      if (f.methods && !f.methods.includes(m)) return false;
      if (f.optional && f.grain) return true;
      if (['entityId', 'value', 'archetype'].includes(f.id)) return false;
      if (grain === 'entity' && ['entities', 'compositeValue'].includes(f.id)) return false;

  }
  const flowSheet = () => state.importFlow.sheets[state.importFlow.sheetIndex];

    const c = fl.confidence[fid] || 0;
    const band = c >= 0.85 ? ['High', 'conf-high', 'ok'] : c >= 0.6 ? ['Medium', 'conf-med', 'warn'] : ['Low', 'conf-low', 'warn'];
    return `<span class="conf ${band[1]}">${icon(band[2], 14)}${band[0]} (${Math.round(c * 100)}%)</span>`;
  }
  function mappingIssues() {
    const fl = state.importFlow, m = method();
    const fields = mappingFieldsFor(m, fl.inputGrain);
    const missing = fields.filter(f => f.required && fl.mapping[f.id] == null);
    const used = {};
    fields.forEach(f => { const c = fl.mapping[f.id]; if (c != null) (used[c] = used[c] || []).push(f.label); });
    const dups = Object.keys(used).filter(k => used[k].length > 1).map(k => `${headerCells()[k]} is mapped to ${used[k].join(' and ')}`);

  }
  function importWizard() {

      const reason = mi.missing.length ? `Map the required ${mi.missing.length === 1 ? 'column' : 'columns'}: ${mi.missing.map(f => f.label).join(', ')}` : !fl.reviewed ? 'Confirm that you have reviewed the mapping' : '';

  function wizSource() {

  function wizMapping() {

  function wizPreview() {

    const rows = flowSheet().rows.slice(fl.headerRow + 1).filter(r => r.some(c => c !== '' && c != null)).slice(0, 5);

  /* ---------- loaded data (upstream fields) ---------- */

  /* ---------- inputs checkpoint (FR-31) ---------- */
  /* After a correction: re-check upstream silently; keep Model Assumptions open if it still passes. */
  function revalidateUpstream() {
    if (!state.checkpoints.inputs) return;
    const v = safe(() => E.validate(buildInputs()), { errors: [] });
    if (!v.errors.some(e => issueStage(e) === 'inputs')) state.checkpoints.inputs = { sig: inputsSig(), at: state.checkpoints.inputs.at };
    else { state.checkpoints.inputs = null; toast('The corrected value fails the inputs check. Review it on Project and Input.', 'warning'); }
  }
  function runInputsCheck() {
    const issues = [];
    const pe = projectErrors();
    const lab = { name: 'Project name', client: 'Client', brand: 'Brand or product', start: 'Planning period start', end: 'Planning period end' };
    const tgt = { name: 'p-name', client: 'p-client', brand: 'p-brand', start: 'p-start', end: 'p-end' };
    Object.keys(pe).forEach(k => issues.push({ where: lab[k], message: pe[k], target: tgt[k] }));
    if (!method()) issues.push({ where: 'Sizing method', message: 'Choose a sizing method.', target: 'method-affordable' });
    if (!state.segments.length) issues.push({ where: 'Segment data', message: 'Import a file or enter segments manually.', target: 'select-files' });
    else if (method()) {
      const v = safe(() => E.validate(buildInputs()), { errors: [{ code: 'engine', path: '', message: 'Validation is unavailable.' }], warnings: [] });
      v.errors.filter(e => issueStage(e) === 'inputs').forEach(e => issues.push({ where: issueWhere(e), message: e.message }));
    }
    const at = nowIso();
    state.checkRuns.inputs = { at, issues };
    if (!issues.length) { state.checkpoints.inputs = { sig: inputsSig(), at }; audit('checkpoint', 'Inputs check passed'); }
    else { state.checkpoints.inputs = null; audit('checkpoint', `Inputs check failed: ${plural(issues.length, 'issue')}`); }
    return issues;
  }
  function checkList(issues) {

  function inputsCheckCard() {
    const run = state.checkRuns.inputs;

    else if (run && run.issues.length) status = msg('error', checkList(run.issues), { title: `${plural(run.issues.length, 'item')} to resolve before continuing` });
    else if (run && !stale) status = msg('warning', 'Inputs changed since the last check. Run the check again.');
    else status = `<p class="muted">Checks the project details, the method choice and every upstream value the method needs. It must pass before Model Assumptions opens.</p>`;
    return card({
      id: 'c-incheck', title: 'Inputs check', sub: 'Validation checkpoint 1 of 2.',
      actions: rq('FR-31') + btn({ label: passed ? 'Run check again' : 'Run inputs check', act: 'runInputs', kind: passed ? 'outline' : 'primary', ic: 'check', id: 'run-inputs', reason: readOnly() ? 'Read-only role' : '' }),
      body: status
    });
  }

  /* ================================================================== 2. MODEL ASSUMPTIONS */
  function lockedView(id) {
    const back = id === 'assumptions' ? 'setup' : id === 'result' ? 'assumptions' : id === 'scenarios' ? 'result' : 'scenarios';
    return card({ body: msg('neutral', esc(lockReason[id]), { title: `${sectionById(id).label} is not available yet`, actions: btn({ label: `Go to ${sectionById(back).label}`, act: 'nav', arg: back, kind: 'primary', id: 'locked-go' }) }) });
  }
  const corrFor = (i, fid) => state.corrections.filter(c => c.segment === state.segments[i].segment && c.fieldId === fid);
  function assumptionIssues() {
    const run = state.checkRuns.assumptions;
    const map = {};
    if (run) run.issues.forEach(x => { if (x.path) map[x.path] = x.message; });
    return map;
  }
  function liveCellError(s, fid) {
    const v = s[fid];
    if (fid === 'reachPct' && isNum(v) && (v < 0 || v > 100)) return 'Reach must be between 0% and 100%';
    if ((fid === 'maxCalls' || fid === 'minCalls' || fid === 'plannedCalls') && isNum(v) && (v < 0 || Math.round(v) !== v)) return 'Use a whole number of 0 or more';
    if (fid === 'minCalls' && isNum(v) && isNum(s.maxCalls) && v > s.maxCalls) return 'Minimum exceeds maximum';
    if (Number.isNaN(v)) return 'Enter a number';
    return '';
  }

  VIEWS.assumptions = function () {
    if (stageStatus('assumptions') === 'locked') return lockedView('assumptions');
    return upstreamCard() + sharedCard() + methodCard() + methodologyCard() + sizingCard() + assumptionsCheckCard();
  };

  function upstreamCard() {

    const up = visibleFields().filter(f => f.owner === 'upstream');

    const body = state.segments.map((s, i) => `<tr>${up.map(f => {
      if (f.id === 'segment') return `<th scope="row" class="rowh">${esc(s.segment)}</th>`;
      const cs = corrFor(i, f.id);
      const shown = f.id === 'archetypeMix' ? (s.archetypeMix ? esc(mixText(s.archetypeMix)) : '<span class="muted">Not supplied</span>') : fmt.num1(s[f.id]);
      const corr = cs.length ? ` <span class="chip chip-info chip-sm" title="Upstream value ${esc(f.id === 'archetypeMix' ? mixText(cs[0].original) : fmt.num1(cs[0].original))}">${icon('edit', 12)}Corrected</span>` : '';
      const action = canCorrect ? `<button type="button" class="ibtn" id="corr-${i}-${f.id}" data-act="${f.id === 'archetypeMix' ? 'editMix' : 'correct'}" data-arg="${i}:${f.id}" aria-label="Correct value: ${esc(f.label(g))}, segment ${esc(s.segment)}" data-tip="Correct value">${icon('edit')}</button>` : '';
      return `<td class="${f.id === 'archetypeMix' ? '' : 'num'} cell-corr"><span class="cell-v">${shown}${corr}</span>${action}</td>`;
    }).join('')}${archPicker(method()) ? `<td>${s.archetypeMix ? 'Mixed' : esc(s.archetype || 'Not set')}</td>` : ''}</tr>`).join('');
    const log = state.corrections.length ? `<p class="lbl mt16">Corrections recorded${rq('FR-07')}</p><div class="grid-wrap"><table class="grid-t"><thead><tr><th scope="col">Segment</th><th scope="col">Field</th><th scope="col" class="num">Upstream value</th><th scope="col" class="num">Corrected to</th><th scope="col">By</th><th scope="col">When</th></tr></thead>
      <tbody>${state.corrections.map(c => { const f = SEG_FIELD(c.fieldId); const show = v => (c.fieldId === 'archetypeMix' ? esc(mixText(v)) : fmt.num1(v)); return `<tr><td>${esc(c.segment)}</td><td>${esc(f ? f.label(g) : c.fieldId)}</td><td class="num">${show(c.original)}</td><td class="num">${show(c.corrected)}</td><td>${esc(c.user)}</td><td>${fmtTime(c.at)}</td></tr>`; }).join('')}</tbody></table></div>` : '';
    const prov = state.provenance;
    return card({
      id: 'c-upstream', title: 'Upstream inputs', sub: `Owned by Segmentation & Targeting ${upstreamBadge()} Read-only. If a value is wrong, use <strong>Correct value</strong>: the original, the correction, your name and the time are recorded.`,
      body: `${prov ? `<p class="src-line">${icon(prov.path === 'file' ? 'file' : 'edit')}<span>${prov.path === 'file' ? `From ${esc(prov.fileName)} (${esc(prov.inputGrain === 'entity' ? 'entity rows' : 'segment summary')})` : 'Entered manually'} · ${plural(state.segments.length, 'segment')}${state.entities ? ` · derived from ${plural(state.entities.length, 'entity row')}` : ''}</span></p>` : ''}
        <div class="grid-wrap"><table class="grid-t"><thead><tr>${up.map(f => `<th scope="col" class="${f.id === 'segment' || f.id === 'archetypeMix' ? '' : 'num'}">${esc(f.label(g))}</th>`).join('')}${archPicker(method()) ? '<th scope="col">Curve archetype</th>' : ''}</tr></thead><tbody>${body}</tbody></table></div>${log}`
    });
  }

  function sharedForEngine() { return buildInputs().shared; }
  function sharedCard() {

    const L = sh.layers || {};

          ${numInput({ id: 'sh-flmspan', bind: 'shared.layers.flmSpan', value: L.flmSpan, label: 'Reps per first-line manager', error: iss['shared.layers'] ? ' ' : '' })}

        <span class="derived-s">${cpc && cpc.perYear && cpc.perYear.length ? `${esc(CPC_LABEL[sh.costPerCallMethod] || '')}. Years 1–${cpc.perYear.length}: ${cpc.perYear.map(fmt.money2).join(' · ')}` : 'Enter capacity and cost to see it.'}</span></div>` : '';

        ${costOn ? `<div class="sep"></div>

          { value: 'fullyLoaded', isDefault: DEFAULTS.costMode === 'fullyLoaded', label: F.OPTION_LABELS.costMode.fullyLoaded, desc: 'One all-in annual cost per rep that already includes managers.' },
          { value: 'layers', isDefault: DEFAULTS.costMode === 'layers', label: F.OPTION_LABELS.costMode.layers, desc: 'Rep cost plus manager cost spread across their spans. Never added to a fully loaded cost.' }] })}
        ${costFields}
        <div class="grid g3 mt16">
          ${numInput({ id: 'sh-infl', bind: 'shared.inflationPct', value: sh.inflationPct, label: 'Annual cost inflation', suffix: '%', error: iss['shared.inflationPct'] })}

        </div>
        ${cpcBox}` : ''}
        <div class="sep"></div>
        ${wl ? (costOn ? disclosure({ id: 'horizon', act: 'toggleHorizon', open: !!state.ui.horizonOpen, label: `Advanced: cost averaging window (${fmt.int(sh.horizon.windowYears)} years)`, body: `<p class="hint mb8">Default 3 years. Cost per call is averaged over this many years.</p><div class="grid g3">
          ${numInput({ id: 'sh-win', bind: 'shared.horizon.windowYears', value: sh.horizon.windowYears, label: 'Window years', error: iss['shared.horizon.windowYears'] })}</div>` }) : '') : disclosure({ id: 'horizon', act: 'toggleHorizon', open: !!state.ui.horizonOpen, label: `Advanced: sizing horizon (${fmt.int(sh.horizon.windowYears)}-year window + ${fmt.int(sh.horizon.tailYears)}-year tail)`, body: `<p class="hint mb8">Default: 3-year window plus a 2-year carryover tail. The forecast table below adjusts to cover every year.</p><div class="grid g3">
          ${numInput({ id: 'sh-win', bind: 'shared.horizon.windowYears', value: sh.horizon.windowYears, label: 'Window years', error: iss['shared.horizon.windowYears'] })}
          ${numInput({ id: 'sh-tail', bind: 'shared.horizon.tailYears', value: sh.horizon.tailYears, label: 'Tail years' })}</div>` })}`
    });
  }

  function valueBlock() {
    const v = ma().value, iss = assumptionIssues(), mode = valueMode();
    const eng = projectMethodAssumptions().value;
    const iv = safe(() => E.impactableValue(eng, sharedForEngine()), null);
    const H = state.shared.horizon, W = H.windowYears || 0;
    const years = v.years || [];
    const chain = `<div class="grid g3">
        ${numInput({ id: 'v-start', bind: 'ma.value.sizingStartYear', value: v.sizingStartYear, label: 'Sizing start year', error: iss['methodAssumptions.value.sizingStartYear'] || (state.checkRuns.assumptions && !isNum(v.sizingStartYear) ? 'This field is required' : ''), hint: 'Required. First year of the sizing window. No default is assumed.' })}
        ${numInput({ id: 'v-gm', bind: 'ma.value.grossMarginPct', value: v.grossMarginPct, label: 'Gross margin', suffix: '%', hint: 'Default 100%.', error: iss['methodAssumptions.value.grossMarginPct'] })}
      </div>
      <div class="grid-wrap mt16"><table class="grid-t"><thead><tr><th scope="col">Year</th><th scope="col">Role</th><th scope="col" class="num">Brand forecast ($)</th><th scope="col" class="num">${v.carryoverConvention === 'sourceYear' ? 'Carryover out of year (%)' : 'Carryover into year (%)'}</th><th scope="col" class="num">Other channels (%)</th></tr></thead>
      <tbody>${years.map((y, i) => `<tr><th scope="row" class="rowh">${isNum(v.sizingStartYear) ? v.sizingStartYear + i : `Year ${i + 1}`}</th><td>${i < W ? `Window ${i + 1}` : `Tail ${i - W + 1}`}</td>
        <td class="cell-in num">${numInput({ id: `vy-${i}-f`, bind: `ma.value.years.${i}.forecast`, value: y.forecast, compact: true, big: true, ariaLabel: `Brand forecast, year ${i + 1}`, error: iss[`methodAssumptions.value.years[${i}]`] ? 'x' : '' })}</td>
        <td class="cell-in num">${numInput({ id: `vy-${i}-c`, bind: `ma.value.years.${i}.carryoverPct`, value: y.carryoverPct, compact: true, suffix: '%', ariaLabel: `Carryover into year ${i + 1}` })}</td>
        <td class="cell-in num">${numInput({ id: `vy-${i}-o`, bind: `ma.value.years.${i}.otherChannelPct`, value: y.otherChannelPct, compact: true, suffix: '%', ariaLabel: `Other channels share, year ${i + 1}` })}</td></tr>`).join('')}</tbody></table></div>
      <p class="hint">Carryover: share of a cohort's sales retained into the next year, recorded on the ${v.carryoverConvention === 'sourceYear' ? 'source' : 'receiving'} year (see Methodology options). Other channels: share of the forecast not attributable to the field force.</p>`;
    const direct = `<div class="grid g3">${numInput({ id: 'v-annual', bind: 'ma.value.annualValue', value: v.annualValue, label: 'Annual impactable value', prefix: '$', big: true, error: iss['methodAssumptions.value.annualValue'] || iss['methodAssumptions.value'], hint: 'Annual value the field force can influence, already net of margin.' })}</div>`;
    const ivErr = iv && iv.errors && iv.errors.length ? iv.errors.join('; ') : '';
    return `<h3 class="sub-h">Impactable value</h3>
      ${radioGroup({ name: 'valueMode', label: 'How do you want to supply it?', value: mode, onAct: 'valueMode', inline: true, options: [{ value: 'chain', label: 'Build from forecast' }, { value: 'direct', label: 'Enter annual impactable value' }] })}
      ${mode === 'chain' ? chain : direct}
      ${disclosure({ id: 'adv', act: 'toggleAdvanced', open: state.ui.advancedOpen, label: 'Advanced: calibration factor', body: `<div class="grid g3">${numInput({ id: 'v-cal', bind: 'ma.value.calibrationFactor', value: v.calibrationFactor, label: 'Calibration factor', hint: 'Default 1.0 (no adjustment). Multiplies the value pool; recorded in the snapshot and export.', error: iss['methodAssumptions.value.calibrationFactor'] })}</div>` })}
      <div class="derived" aria-live="polite"><span class="derived-k">Value pool</span><span class="derived-v">${iv && isNum(iv.pool) ? fmt.money(iv.pool) : '—'}</span>
        <span class="derived-s">${iv && isNum(iv.annual) ? `Annual impactable value ${fmt.money(iv.annual)} × calibration ${fmt.num(iv.calibrationFactor, 2)}` : ivErr ? esc(ivErr) : 'Complete the inputs above to see it.'}</span></div>`;
  }

  function methodCard() {
    const m = method(), o = ma(), iss = assumptionIssues();
    if (m === 'workload') return card({ id: 'c-method-a', title: `Method-specific: ${methodLabel(m)}`, body: msg('neutral', 'Workload Buildup needs nothing beyond reach % and planned annual calls per segment, set in the table below. There is no ROI cutoff, minimum or maximum, composite value, curve or allocation.') });
    const alloc = radioGroup({ name: 'allocation', label: 'Value allocation across segments', value: o.allocation, onAct: 'allocation', describe: true, options: [
      { value: 'proportional', isDefault: DEFAULTS.allocation === 'proportional', label: F.OPTION_LABELS.allocation.proportional, desc: 'Each segment gets value in line with its composite score.' },
      { value: 'equal', isDefault: DEFAULTS.allocation === 'equal', label: F.OPTION_LABELS.allocation.equal, desc: 'Every segment with entities and reach gets the same share.' },
      { value: 'custom', isDefault: DEFAULTS.allocation === 'custom', label: F.OPTION_LABELS.allocation.custom, desc: 'You enter a value share per segment; shares must total 100%.' }] });
    let specific = '';
    if (m === 'affordable') {
      specific = `<div class="grid g3">${numInput({ id: 'a-cut', bind: 'ma.totalRoiCutoff', value: o.totalRoiCutoff, label: 'Total ROI cutoff', error: iss['methodAssumptions.totalRoiCutoff'], hint: 'Value each $1 of field cost must return. 1.5 means $1.50 per $1.' })}</div>`;
    } else {
      const eq = isNum(o.cutoff) ? safe(() => E.roiEquivalent(o.roiBasis, o.cutoff), null) : null;
      const eqTxt = eq ? (o.roiBasis === 'gross' ? `Equivalent to a net ROI of ${fmt.num(eq.net, 2)}.` : `Equivalent to a gross ratio of ${fmt.num(eq.gross, 2)}.`) : '';
      specific = `${radioGroup({ name: 'roiBasis', label: 'ROI basis', value: o.roiBasis, onAct: 'roiBasis', inline: true, hint: 'Switching keeps the same threshold by converting the cutoff.', options: ['gross', 'net'].map(b => ({ value: b, isDefault: b === DEFAULTS.roiBasis, label: F.OPTION_LABELS.roiBasis[b] })) })}
        <div class="grid g3">${numInput({ id: 'r-cut', bind: 'ma.cutoff', value: o.cutoff, label: `Marginal ROI cutoff (${o.roiBasis === 'gross' ? 'gross ratio' : 'net ROI'})`, error: iss['methodAssumptions.cutoff'], hint: `Default 1.0 gross. ${esc(eqTxt)}` })}
          ${numInput({ id: 'r-max', bind: 'ma.scenarioMaxCalls', value: o.scenarioMaxCalls, label: 'Scenario maximum calls', suffix: 'calls', error: iss['methodAssumptions.scenarioMaxCalls'], hint: 'Default 48. Response curves are scaled so value at this call count equals the allocated value.' })}</div>
        ${radioGroup({ name: 'stop', label: 'Stopping rule', value: o.stoppingRule, onAct: 'stoppingRule', describe: true, options: ['first-fail', 'min-block', 'max-pass'].map(r => ({ value: r, isDefault: r === DEFAULTS.stoppingRule, label: F.OPTION_LABELS.stoppingRule[r], desc: STOP_EXPLAIN[r] })) })}`;
    }
    return card({ id: 'c-method-a', title: `Method-specific: ${methodLabel(m)}`, sub: esc(F.METHODS[m].question), body: valueBlock() + '<div class="sep"></div>' + alloc + '<div class="sep"></div>' + specific });
  }

  const CPC_LABEL = OL('costPerCallMethod');
  function capacityFields(iss) {
    const ci = state.shared.capacityInput;
    if (ci.mode !== 'derived') return numInput({ id: 'sh-cap', bind: 'shared.capacity', value: state.shared.capacity, label: 'Effective annual calls per rep', suffix: 'calls', big: true, error: iss['shared.capacity'], hint: 'Calls one rep can deliver in a year after time off, training and admin.' });
    const rc = E.resolveCapacity ? safe(() => E.resolveCapacity(sharedForEngine()), null) : null;
    const derived = rc && isNum(rc.capacity) ? rc.capacity : null;
    return `${numInput({ id: 'sh-cpd', bind: 'shared.capacityInput.callsPerDay', value: ci.callsPerDay, label: 'Calls per day', error: iss['shared.capacityInput'] ? ' ' : '' })}
      ${numInput({ id: 'sh-days', bind: 'shared.capacityInput.workingDays', value: ci.workingDays, label: 'Working days per year', suffix: 'days' })}
      <div class="derived derived-inline" aria-live="polite"><span class="derived-k">Effective annual calls per rep</span><span class="derived-v">${derived == null ? '—' : fmt.int(derived)}</span><span class="derived-s">Calls per day × working days</span></div>
      ${iss['shared.capacityInput'] ? `<div class="err">${esc(iss['shared.capacityInput'])}</div>` : ''}`;
  }
  /* Methodology variants from contract v1.2/v1.3. Only options that apply to the selected method are shown. */
  function methodologyOptions() {
    const m = method(), sh = state.shared, o = ma() || {};
    const usesCost = m !== 'workload' || state.workloadCost;
    const list = [
      { key: 'fteRounding', scope: 'shared', label: 'Recommended FTE rounding', value: sh.fteRounding, def: DEFAULTS.fteRounding, options: [
        { value: 'nearest', label: OL('fteRounding').nearest, desc: 'Rounds the summed raw FTE to the nearest whole FTE.' },
        { value: 'up', label: OL('fteRounding').up, desc: 'Rounds the summed raw FTE up to the next whole FTE.' },
        { value: 'none', label: OL('fteRounding').none, desc: 'Reports the unrounded sum as the recommended FTE.' }] },
      { key: 'capacityMode', scope: 'shared', label: 'Capacity input', value: sh.capacityInput.mode, def: DEFAULTS.capacityMode, options: [
        { value: 'direct', label: OL('capacityInput').direct, desc: 'You type the yearly call capacity of one rep.' },
        { value: 'derived', label: OL('capacityInput').derived, desc: 'Capacity is the product of the two; it appears in the calculation trace.' }] }
    ];
    if (usesCost) list.push({ key: 'costPerCallMethod', scope: 'shared', label: 'Cost per call method', value: sh.costPerCallMethod, def: DEFAULTS.costPerCallMethod, options: [
      { value: 'single-window', label: CPC_LABEL['single-window'], desc: 'Discounts each window year\u2019s cost per call to today and averages them.' },
      { value: 'rolling-windows', label: CPC_LABEL['rolling-windows'], desc: 'Averages three discounted 3-year windows that each start a year later.' }] });
    if (m === 'affordable' || m === 'response') list.push({ key: 'minimumBoundary', scope: 'ma', label: 'Minimum calls boundary', value: o.minimumBoundary, def: DEFAULTS.minimumBoundary, options: [
      { value: 'inclusive', label: OL('minimumBoundary').inclusive, desc: 'A segment whose calls land exactly on the minimum is kept.' },
      { value: 'strict', label: OL('minimumBoundary').strict, desc: 'Calls must be above the minimum to be kept.' }] });
    if (m === 'response') {
      list.push({ key: 'cutoffTie', scope: 'ma', label: 'Call exactly at the cutoff', value: o.cutoffTie, def: DEFAULTS.cutoffTie, options: [
        { value: 'include', label: OL('cutoffTie').include, desc: 'A call whose marginal ROI equals the cutoff counts as passing.' },
        { value: 'exclude', label: OL('cutoffTie').exclude, desc: 'A call must beat the cutoff to pass.' }] });
      const capMapped = state.inputGrain === 'entity' && state.provenance && state.provenance.mapping && state.provenance.mapping.maxCalls;
      list.push({ key: 'maxCallsSource', scope: 'ma', label: 'Where maximum calls come from', value: o.maxCallsSource, def: DEFAULTS.maxCallsSource, options: [
        { value: 'segment', label: OL('maxCallsSource').segment, desc: 'Every entity in a segment shares the segment’s maximum calls.' },
        { value: 'entityAttribute', label: OL('maxCallsSource').entityAttribute, disabled: !capMapped,
          desc: capMapped ? `Uses the mapped column “${state.provenance.mapping.maxCalls}”; entities without a value fall back to the segment maximum.` : 'Available after importing entity rows with a Maximum calls (entity/specialty) column mapped.' }] });
      list.push({ key: 'reachAppliesTo', scope: 'ma', label: 'What reach scales', value: o.reachAppliesTo, def: DEFAULTS.reachAppliesTo, options: [
        { value: 'calls', label: OL('reachAppliesTo').calls, desc: 'Contribution is not reduced by reach (flagged as a methodology note).' },
        { value: 'callsAndValue', label: OL('reachAppliesTo').callsAndValue, desc: 'Reach also scales the value each segment contributes.' }] });
    }
    if ((m === 'affordable' || m === 'response') && valueMode() === 'chain') list.push({ key: 'carryoverConvention', scope: 'value', label: 'Forecast carryover convention', value: (o.value && o.value.carryoverConvention) || DEFAULTS.carryoverConvention, def: DEFAULTS.carryoverConvention, options: [
      { value: 'receivingYear', label: OL('carryoverConvention').receivingYear, desc: 'Example: 30% on the 2028 row means 30% of 2027’s cohort sales carry into 2028.' },
      { value: 'sourceYear', label: OL('carryoverConvention').sourceYear, desc: 'Example: 30% on the 2027 row means 30% of 2027’s cohort sales carry into 2028.' }] });
    return list;
  }
  /* Differences from disclosed defaults, for the "Non-default methodology" chip. Works on engine inputs so snapshots can be checked too. */
  function nonDefaultList(inp) {
    if (!inp || !inp.shared) return [];
    const out = [], sh = inp.shared, o = inp.methodAssumptions || {}, m = inp.method;
    const chk = (cond, label) => { if (cond) out.push(label); };

      options: o.options.map(x => Object.assign({ isDefault: x.value === o.def }, x)) })).join('<div class="sep sep-sm"></div>');

  function runAssumptionsCheck() {
    const issues = [];

    const inp = buildInputs();
    if (valueMode() === 'chain' && method() !== 'workload' && !isNum(ma().value.sizingStartYear)) issues.push({ where: 'Sizing start year', message: 'Enter the sizing start year; no default is assumed.', path: 'methodAssumptions.value.sizingStartYear', target: 'v-start' });

      const lbl = f.label(state.project.grain), path = `segments[${i}].${f.id}`;
      const e = s[f.id] == null ? `${lbl} is required` : liveCellError(s, f.id);
      if (e) { issues.push({ where: `Segment ${s.segment} · ${lbl}`, message: e, path }); mine.add(path); }
    }));
    const v = safe(() => E.validate(inp), { errors: [{ code: 'engine', path: '', message: 'Validation is unavailable.' }], warnings: [] });
    v.errors.filter(e => !mine.has(e.path)).forEach(e => issues.push({ where: issueWhere(e), message: e.message, path: e.path }));
    const at = nowIso();
    state.checkRuns.assumptions = { at, issues, warnings: v.warnings };
    if (!issues.length) { state.checkpoints.assumptions = { sig: assumptionsSig(), at }; audit('checkpoint', 'Assumptions check passed'); }
    else { state.checkpoints.assumptions = null; audit('checkpoint', `Assumptions check failed: ${plural(issues.length, 'issue')}`); }

  }
  function assumptionsCheckCard() {

    else if (run && run.issues.length) status = msg('error', checkList(run.issues.slice(0, 25)) + (run.issues.length > 25 ? `<p>…and ${run.issues.length - 25} more.</p>` : ''), { title: `${plural(run.issues.length, 'item')} to resolve before calculating` });

  }

  /* ================================================================== 3. FTE CALCULATION */
  function fmtDriver(d) {
    const v = d.value;
    if (typeof v === 'string') return esc(F.OPTION_LABELS.stoppingRule[v] || v);
    if (!isNum(v)) return '—';
    if (/cost|value|pool|forfeit/i.test(d.label)) return Math.abs(v) < 1000 && v !== 0 ? fmt.money2(v) : fmt.money(v);
    if (/average reach|reach %/i.test(d.label)) return fmt.pct(v);
    if (/planned calls/i.test(d.label)) return `${fmt.num(v, 1)} calls`;
    return Math.abs(v) >= 100 ? fmt.int(v) : fmt.num(v, 2);
  }
  function roiLabel(t) {
    if (!t) return F.RESULT_LABELS.roi();
    if (t.roiBasis) return `${F.RESULT_LABELS.roi()} (${t.roiBasis === 'net' ? 'net' : 'gross ratio'})`;
    return F.RESULT_LABELS.roi();
  }
  function kpiTiles(r, g) {
    const t = r.totals, m = r.method;
    const roiSub = m === 'workload' ? 'Not applicable to Workload Buildup' : t.roi == null ? 'Not supported by these inputs' : t.roiBasis === 'net' && isNum(t.roiGross) ? `Gross ratio ${fmt.num(t.roiGross, 2)}` : m === 'affordable' ? 'Retained value ÷ field cost' : 'Contribution ÷ field cost';
    const tiles = [
      [F.RESULT_LABELS.reached(g), fmt.int(t.reached), `of ${fmt.int(t.entities)} ${grainMany(g)}`],
      [F.RESULT_LABELS.totalCalls(), fmt.int(t.totalCalls), 'per year'],
      [F.RESULT_LABELS.avgCallsPerReached(g), fmt.num(t.avgCallsPerReached, 1), 'calls per year'],
      [F.RESULT_LABELS.entitiesPerRep(g), fmt.num(t.entitiesPerRep, 1), 'reached, per recommended FTE'],
      [F.RESULT_LABELS.fieldCost(), t.fieldCost == null ? 'N/A' : { full: fmt.money(t.fieldCost), short: fmt.moneyShort(t.fieldCost) }, t.fieldCost == null ? 'No cost supplied' : isNum(t.costPerCall) ? `${fmt.money2(t.costPerCall)} per call` : ''],
      [roiLabel(t), fmt.roi(t.roi), roiSub]
    ];
    return `<ul class="kpis" aria-label="Supporting measures">${tiles.map(([k, v, s]) => `<li class="kpi"><span class="kpi-k">${esc(k)}</span>${typeof v === 'object' ? `<span class="kpi-v" title="${esc(v.full)}"><span class="v-full">${esc(v.full)}</span><span class="v-short" aria-hidden="true">${esc(v.short)}</span></span>` : `<span class="kpi-v">${esc(v)}</span>`}<span class="kpi-s">${esc(s)}</span></li>`).join('')}</ul>`;
  }
  function heroCard(r) {

    const notes = (r.warnings || []).filter(w => w.code !== 'value-forfeited');

  function segmentResultCard(r) {
    const g = state.project.grain, L = F.RESULT_LABELS, one = grainOne(g), many = grainMany(g);
    const showAff = r.segments.some(s => isNum(s.affordableCallsPerEntity));
    const constraint = s => (s.excluded ? `<span class="flag">${icon('x', 14)}Excluded: ${esc(exclusionLabel(r.method, s.exclusionReason))}</span>` : esc(BINDING_LABEL[s.binding] || s.binding));

        <tfoot><tr>${cols.map((c, ci) => ci === 0 ? '<th scope="row" class="rowh">Total</th>' : `<td class="${c[4] ? 'num' : ''}">${totals[c[0]] || ''}</td>`).join('')}</tr></tfoot></table></div>

        <tbody>${(r.trace || []).map((s, i) => `<tr><td class="num">${i + 1}</td><td>${esc(s.step)}</td><td class="mono formula">${esc(s.formula)}</td><td class="num">${isNum(s.value) ? (Math.abs(s.value) >= 1000 ? fmt.int(s.value) : fmt.num(s.value, 4)) : '—'}</td>${state.showReq ? `<td class="muted">${esc(s.source)}</td>` : ''}</tr>`).join('')}</tbody></table></div>` }) });
  }

  VIEWS.result = function () {
    if (stageStatus('result') === 'locked') return lockedView('result');
    const r = state.result, current = resultIsCurrent();
    const asOk = stageStatus('assumptions') === 'complete';
    const reason = readOnly() ? 'Read-only role' : !asOk ? 'Pass the assumptions check on Model Assumptions first' : '';
    const calcBtn = btn({ label: r ? 'Recalculate' : 'Calculate FTE', act: 'calculate', kind: 'primary', ic: r ? 'refresh' : 'calc', id: 'calc', reason });
    let top = card({ id: 'c-calc', title: 'Calculation', sub: `Deterministic: the same inputs always give the same field size. Method: ${esc(methodLabel(method()))}.`, actions: calcBtn,
      body: !r ? `<p class="muted">Nothing calculated yet. Calculate to see the field size and how it was reached.</p>` : `<p class="muted">Last calculated ${fmtTime(state.resultAt)} with ${esc(r.engineVersion)}.</p>` });
    if (r && !current) top += msg('warning', `Inputs or assumptions changed after this result was calculated (${fmtTime(state.resultAt)}). The figures below do not reflect the current inputs. Recalculate before saving a scenario.`, { title: 'Result is out of date', id: 'stale-banner', actions: asOk && !readOnly() ? btn({ label: 'Recalculate now', act: 'calculate', kind: 'outline', ic: 'refresh', id: 'calc-stale' }) : btn({ label: 'Go to Model Assumptions', act: 'nav', arg: 'assumptions', kind: 'outline', id: 'stale-go' }) });

    const next = current ? card({ body: `<div class="row-between"><span>Happy with this result? Save it as an immutable scenario snapshot to compare and recommend.</span>${btn({ label: 'Go to Scenario Summary', act: 'nav', arg: 'scenarios', kind: 'outline', ic: 'chevRight', id: 'go-scen' })}</div>` }) : '';
    return `${top}<div class="${current ? '' : 'is-stale'}">${heroCard(r)}${whyCard(r)}${segmentResultCard(r)}${traceCard(r)}</div>${next}`;
  };

  /* ================================================================== 4. SCENARIO SUMMARY */
  const objectives = () => (SAMPLE && SAMPLE.objectives) || ['Balanced', 'Coverage-led', 'Efficiency-led'];
  const defaultName = v => `${state.project.brand || 'Untitled brand'} · ${methodLabel(method())} · ${state.objective} · v${v}`;
  const scen = id => state.scenarios.find(s => s.id === id);

  function saveReason() {

  }

    if (s.recommended) return 'Already the recommended scenario';
    if (rec && rec.status === 'approved') return `${rec.name} is approved and locked as the recommendation. Clone it to revise.`;
    if (rec && rec.status === 'in_review') return `${rec.name} is in review. Wait for the decision before changing the recommendation.`;
